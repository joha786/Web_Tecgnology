<!DOCTYPE html>
<html>

<head>
    <title>Array Manupulation</title>
</head>

<body>
    
    <h2>Push and Shift Elements in Array</h2>
    <h3>Check the browser console output</h3>

    <script>
        
        var arr = [1,2,3,4,5];
        
        arr.push(6); //Added Element

        arr.shift(); //Remove the first element

        console.log("Modified Array: "+ arr);
    </script>

</body>

</html>
