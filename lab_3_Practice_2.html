<!DOCTYPE html>
<html>

<head>
    <title>Find the largest number</title>
</head>

<body>
    
    <h2>Find The Largest Number Script</h2>
    <h3>Check the browser console output</h3>

    <script>
        var num1 = 15;
        var num2 = 22;
        var num3 = 8;

        var largest = num1;
        
        if(num2>largest){
            largest = num2;
        }
        
        if(num3>largest){
            largest = num3;
        }

        console.log("The largest number is: "+largest);
    </script>

</body>

</html>
