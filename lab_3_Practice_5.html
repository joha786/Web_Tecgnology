<!DOCTYPE html>
<html>

<head>
    <title>String Reverse</title>
</head>

<body>
    
    <h2>Reverse of String</h2>
    <h3>Check the browser console output</h3>

    <script>
        
        var str = "JavaScript";
        var resversedStr="";
        
        for(var i=str.length-1; i >=0; i--){
            resversedStr+=str[i];
        }

        console.log("Reversed string is: "+resversedStr);
    </script>

</body>

</html>
