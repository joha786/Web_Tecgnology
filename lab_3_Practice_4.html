<!DOCTYPE html>
<html>

<head>
    <title>Factorial</title>
</head>

<body>
    
    <h2>Factorial of a number</h2>
    <h3>Check the browser console output</h3>

    <script>
        
        var num = 5;
        var factorial = 1;
        for(var i=num; i >0; i--){
            factorial *=i;
        }

        console.log("Factorial of " + num + " is: "+factorial);
    </script>

</body>

</html>
