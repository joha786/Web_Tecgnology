<!DOCTYPE html>
<html>

<head>
    <title>Object</title>
</head>

<body>
    
    <h2>Object Example</h2>
    <h3>Check the browser console output</h3>

    <script>
        
        var person = {
            name:"Joha",
            age:23
        };

        console.log("Name: "+ person.name);
        console.log("Age: "+ person.age);
    </script>
