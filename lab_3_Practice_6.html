<!DOCTYPE html>
<html>

<head>
    <title>Array Manupulation</title>
</head>

<body>
    
    <h2>Sum of Array Elements</h2>
    <h3>Check the browser console output</h3>

    <script>
        
        var arr = [1,2,3,4,5];
        var sum=0;

        for(var i=0; i<arr.length; i++){
            sum+=arr[i];
        }

        console.log("Sum of the Array is: "+sum);
    </script>

</body>

</html>
